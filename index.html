<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Змейка</title>
    <link rel="shortcut icon" href="./images/icon.png" type="image/png">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/game.css">

    <script type="module" src="script.js" defer></script>
</head>

<body>
    <div class="menuContainer" id="menuContainer">

        <img src="./images/logoGame.png" class="logoGame" alt="я - змея"/>
        <div class="logoText">Game SNAKE</div>

        <div class="levelsGame">
            <div class="labelContainer labelContainerEasy">
                <label for="levelEasy" class="label">
                    <input type="radio" id="levelEasy" name="levelName" value="levelEasy" checked />
                    <span>levelEasy</span>
                </label>
            </div>
            <div class="labelContainer labelContainerMedium">
                <label for="levelMedium" class="label">
                    <input type="radio" id="levelMedium" name="levelName" value="levelMedium" />
                    <span>levelMedium</span>
                </label>
            </div>
        </div>

        <button class="start" id="start">Start</button>
    </div>
</body>

</html>
